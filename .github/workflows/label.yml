name: label

# Automatic labels: PRs by changed path, issues by keywords in the title/body.
# No labels are created by this workflow and none are removed (sync-labels: false),
# so it only ever adds labels that already exist in the repository.

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-paths:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false

  issue-keywords:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title || '';
            const body = context.payload.issue.body || '';
            const text = title + '\n' + body;
            const rules = [
              ['bug', [/\b(bug|crash|error|broken|regression|fails?|fix)\b/i, /报错|崩溃|失败|异常|不生效/]],
              ['enhancement', [/\b(feat|feature|proposal|improve|suggest|enhance|refactor)\b/i, /功能|建议|优化|增强|改进/]],
              ['documentation', [/\b(doc|docs|readme|typo|changelog|template)\b/i, /文档|说明|模板/]],
              ['question', [/\b(question|how|why|wonder)\b/i, /如何|为什么|请教|疑问|\?/]]
            ];
            const matches = (patterns) => patterns.some((re) => re.test(text));
            const labels = rules.filter(([, patterns]) => matches(patterns)).map(([name]) => name);
            if (labels.length === 0) {
              core.info('No keyword matched; leaving labels untouched.');
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels
            });
            core.info('Added labels: ' + labels.join(', '));
